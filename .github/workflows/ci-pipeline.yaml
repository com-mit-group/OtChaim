name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: yaron-E92/AutoDev/.github/workflows/profile-baseline.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      require_concurrency: true
    permissions:
      contents: read

  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: yaron-E92/AutoDev/.github/workflows/version-intent.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      pr_body: ${{ github.event.pull_request.body }}
      head: ${{ github.sha }}
    permissions:
      contents: read

  headless:
    name: Headless .NET validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-dotnet.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      runner: windows-latest
      global_json_file: global.json
      setup_command: bash scripts/ci-configure-nuget.sh
      restore_command: dotnet restore OtChaim.NoGUI.slnf
      build_command: dotnet build OtChaim.NoGUI.slnf --configuration NoGUI --no-restore
      test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/headless
        dotnet test OtChaim.NoGUI.slnf \
          --configuration NoGUI \
          --no-build \
          --no-restore \
          --logger 'trx;LogFilePrefix=headless' \
          --results-directory artifacts/ci/headless \
          --collect:'XPlat Code Coverage;Format=opencover' \
          --verbosity normal
      test_results_path: artifacts/ci/headless/**
      artifact_name: otchaim-headless-results
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  maui:
    name: MAUI product validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-maui.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      global_json_file: global.json
      headless_enabled: false

      android_enabled: true
      android_runner: ubuntu-latest
      android_setup_command: |
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-android --skip-manifest-update
      android_restore_command: dotnet restore OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj
      android_build_command: dotnet build OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj --configuration Release --framework net8.0-android --no-restore
      android_test_command: find OtChaim.Presentation.MAUI/bin/Release/net8.0-android -type f -name 'OtChaim.Presentation.MAUI.dll' -print -quit | grep -q .

      windows_enabled: true
      windows_runner: windows-latest
      windows_setup_command: |
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-windows --skip-manifest-update
      windows_restore_command: dotnet restore OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj --runtime win-x64 -p:OtChaimWindowsOnly=true
      windows_build_command: dotnet build OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --runtime win-x64 --no-restore -p:OtChaimWindowsOnly=true -p:WindowsPackageType=None -p:WindowsAppSdkDeploymentManagerInitialize=false
      windows_test_command: find OtChaim.Presentation.MAUI/bin/Release/net8.0-windows10.0.19041.0 -type f -name 'OtChaim.Presentation.MAUI.dll' -print -quit | grep -q .
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  sonar:
    name: SonarCloud - full solution analysis
    needs: [headless, maui]
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET 8 from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Configure package feed and MAUI workloads
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-configure-nuget.sh
          dotnet workload install maui-android maui-windows --skip-manifest-update
          dotnet restore OtChaim.sln

      - name: Install Sonar scanner
        shell: pwsh
        run: dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Analyze full solution and collect coverage
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"com-mit-group_OtChaim" `
            /o:"com-mit-group" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.projectBaseDir="${{ github.workspace }}" `
            /d:sonar.cs.opencover.reportsPaths="artifacts/ci/sonar/**/coverage.opencover.xml"

          dotnet build OtChaim.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path artifacts/ci/sonar | Out-Null
          dotnet test OtChaim.NoGUI.slnf `
            --configuration Release `
            --no-build `
            --no-restore `
            --results-directory artifacts/ci/sonar `
            --collect:"XPlat Code Coverage;Format=opencover"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  ci-gate:
    name: CI gate
    if: always()
    needs: [baseline, version-intent, headless, maui, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require version policy and product validation
        shell: bash
        env:
          BASELINE: ${{ needs.baseline.result }}
          VERSION_INTENT: ${{ needs.version-intent.result }}
          HEADLESS: ${{ needs.headless.result }}
          MAUI: ${{ needs.maui.result }}
          SONAR: ${{ needs.sonar.result }}
        run: |
          set -euo pipefail
          if [[ "$BASELINE" != 'success' ||
                "$HEADLESS" != 'success' ||
                "$MAUI" != 'success' ||
                "$SONAR" != 'success' ]]; then
            echo "Required CI failed: baseline=$BASELINE headless=$HEADLESS maui=$MAUI sonar=$SONAR" >&2
            exit 1
          fi

          if [[ "$VERSION_INTENT" != 'success' && "$VERSION_INTENT" != 'skipped' ]]; then
            echo "Version intent validation failed: $VERSION_INTENT" >&2
            exit 1
          fi

          echo 'OtChaim authoritative CI passed.'

  version-tag:
    name: Advance version tag
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    uses: yaron-E92/AutoDev/.github/workflows/version-tag.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      head: ${{ github.sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
