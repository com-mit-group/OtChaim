name: Run Integration Tests (Manual)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: yaron-E92/AutoDev/.github/workflows/profile-baseline.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      require_concurrency: true
    permissions:
      contents: read

  integration-tests:
    name: Integration tests
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-dotnet.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      runner: ubuntu-latest
      global_json_file: ''
      dotnet_version: 8.0.x
      setup_command: bash scripts/ci-configure-nuget.sh
      restore_command: dotnet restore OtChaim.IntegrationTests/OtChaim.IntegrationTests.csproj
      build_command: dotnet build OtChaim.IntegrationTests/OtChaim.IntegrationTests.csproj --configuration Release --no-restore
      test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/integration
        dotnet test OtChaim.IntegrationTests/OtChaim.IntegrationTests.csproj \
          --configuration Release \
          --no-build \
          --no-restore \
          --logger 'trx;LogFilePrefix=integration' \
          --results-directory artifacts/ci/integration \
          --filter TestCategory=Integration
      test_results_path: artifacts/ci/integration/*.trx
      artifact_name: otchaim-integration-results
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
